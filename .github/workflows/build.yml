name: Build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTx-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  receptor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
      - run: |
          cd PC
          x86_64-w64-mingw32-gcc receptor.c -o receptor64.exe -O2 -s -static -D_WIN32_WINNT=0x0601 -lws2_32 -lwinmm
          i686-w64-mingw32-gcc   receptor.c -o receptor32.exe -O2 -s -static -D_WIN32_WINNT=0x0601 -lws2_32 -lwinmm
      - uses: actions/upload-artifact@v4
        with:
          name: AudioTx-receptor-windows
          path: PC/*.exe
